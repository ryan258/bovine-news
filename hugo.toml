baseURL = "https://bovine.news/"
locale = "en-us"
title = "Bovine News Network"

enableRobotsTXT = true
summarylength = 40

[params]
  brandLine = "No Bull. Just Moo-Point."
  city = "Bentonville, AR"

[params.features]
  # Temporarily retired from the public experience; source and content are preserved.
  video = false

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[permalinks]
  news = "/news/:slug/"
  video = "/video/:slug/"

[markup.goldmark.renderer]
  unsafe = true

[frontmatter]
  date = ["published_date", "date", ":default"]
  lastmod = ["updated_date", "lastmod", ":default"]

[services.rss]
  limit = 20
