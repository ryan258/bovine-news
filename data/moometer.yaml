# THE MOO METER — the newsroom's daily audience sentiment instrument.
# One question per day, selected by calendar. Methodology: vibes.
# "weight" seeds the result distribution; it is not a real number and we
# will not be taking questions at this time.

methodology: "Methodology: vibes."
disclaimer_after_vote: "Results are not scientific. Neither are cows, strictly, but here we are."

questions:
