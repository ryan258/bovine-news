    question: "Should the community salad bar start checking ID at the door?"
    footnote: "Asked following Exhibit F of The Gate Files."
    options:
      - label: "Yes, effective immediately"
        weight: 22
      - label: "No, the bar must remain free"
        weight: 51
      - label: "Only between 11 p.m. and 4 a.m."
        weight: 24
      - label: "There's a salad bar?"
        weight: 3
  - id: "gate-feelings"
    question: "How personally do you take whoever opened the gate?"
    options:
      - label: "Very personally"
        weight: 44
      - label: "Professionally, as a journalist"
        weight: 18
      - label: "I opened the gate"
        weight: 9
      - label: "I keep rereading the note"
        weight: 29
  - id: "intersection-meeting"
    question: "The intersection meeting that delayed traffic an hour: was it necessary?"
    options:
      - label: "Absolutely, and I'd sit through it again"
