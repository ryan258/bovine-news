{{ define "main" }}
<div class="page-header">
  <div class="container">
    <h1>About Bovine News</h1>
  </div>
</div>
<div class="container prose-page">
  {{ range .Params.sections }}
  <section class="about-section">
    <h2>{{ .heading }}</h2>
    <p>{{ .body }}</p>
  </section>
  {{ end }}
</div>
<div class="container">
  <h2 class="section-title">Meet the Herd</h2>
  <div class="reporter-grid">
    {{ $team := where site.RegularPages "Section" "team" }}
    {{ range $team.ByParam "weight" }}{{ partial "reporter-card.html" . }}{{ end }}
  </div>
</div>
{{ end }}
