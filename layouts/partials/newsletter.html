<section class="newsletter">
  <div class="container newsletter__inner">
    <div class="newsletter__label">
      <span class="newsletter__icon">{{ partial "icon.html" (dict "name" "mail") }}</span>
      <div>
        <h2>Stay in the Know</h2>
        <p>Top stories, weather, and sports — delivered to your inbox every weekday morning.</p>
      </div>
    </div>
    <form class="newsletter__form" novalidate>
      <label for="newsletter-email" class="sr-only">Email address</label>
      <input id="newsletter-email" name="email" type="email" placeholder="Enter your email" required autocomplete="email">
      <button type="submit" class="btn btn--primary">Subscribe</button>
    </form>
  </div>
  <p class="container newsletter__consent">By subscribing you agree to receive email updates from Bovine News Network. You can unsubscribe at any time. See our <a href="{{ "/privacy/" | relURL }}">Privacy Policy</a>.</p>
</section>
