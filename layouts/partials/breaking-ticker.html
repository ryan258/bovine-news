{{- $b := hugo.Data.breaking -}}
{{- if $b.active -}}
<div class="ticker" data-ticker>
  <div class="container ticker__inner">
    <span class="ticker__label"><span class="live-dot" aria-hidden="true"></span> Breaking</span>
    <div class="ticker__track-wrap">
      <ul class="ticker__track" data-ticker-track>
        {{ range $b.items }}<li><a href="{{ .link | relURL }}">{{ .text }}</a></li>{{ end }}
        {{ range $b.items }}<li aria-hidden="true"><a href="{{ .link | relURL }}" tabindex="-1">{{ .text }}</a></li>{{ end }}
      </ul>
    </div>
    <a class="ticker__viewall" href="{{ "/news/" | relURL }}">View All {{ partial "icon.html" (dict "name" "chevron-right" "class" "icon--sm") }}</a>
  </div>
</div>
{{- end -}}
