{{- $color := .color | default "navy" -}}
{{- $class := .class | default "" -}}
<div class="portrait portrait--{{ $color }} {{ $class }}" role="img" aria-label="Portrait illustration">
  <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
    <rect width="100" height="100" class="portrait__bg"/>
    <ellipse cx="50" cy="98" rx="30" ry="14" class="portrait__collar"/>
    <path d="M28 34c-6-10 2-20 12-16 4-8 16-8 20 0 10-4 18 6 12 16 4 6 2 15-6 18-2 8-30 8-32 0-8-3-10-12-6-18Z" class="portrait__head"/>
    <path d="M26 30c-6-6-4-16 4-16 3 0 5 2 6 5-6 2-9 6-10 11Z" class="portrait__ear"/>
    <path d="M74 30c6-6 4-16-4-16-3 0-5 2-6 5 6 2 9 6 10 11Z" class="portrait__ear"/>
    <ellipse cx="50" cy="46" rx="13" ry="9" class="portrait__snout"/>
    <ellipse cx="45" cy="46" rx="1.8" ry="2.4" class="portrait__nostril"/>
    <ellipse cx="55" cy="46" rx="1.8" ry="2.4" class="portrait__nostril"/>
    <circle cx="36" cy="33" r="3" class="portrait__eye"/>
    <circle cx="64" cy="33" r="3" class="portrait__eye"/>
  </svg>
</div>
