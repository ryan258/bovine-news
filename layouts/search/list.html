{{ define "main" }}
<div class="page-header">
  <div class="container">
    <h1>Search</h1>
    <p>Search by title, category, reporter, or tag.</p>
  </div>
</div>
<div class="container">
  <div class="search-box">
    <label for="search-input" class="sr-only">Search stories</label>
    {{ partial "icon.html" (dict "name" "search") }}
    <input id="search-input" type="search" placeholder="Search stories&hellip;" data-search-input autocomplete="off">
  </div>
  <p class="search-status" data-search-status aria-live="polite"></p>
  <div class="story-grid story-grid--list" data-search-results
    data-index-url="{{ "index.json" | relURL }}"
    data-category-base="{{ "categories/" | relURL }}"></div>
</div>
{{ end }}
