<!doctype html>
<html lang="en">
<head>
{{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/main.js" }}
  <script src="{{ $js.RelPermalink }}" defer></script>
  {{ if eq .Type "search" }}{{ $searchJs := resources.Get "js/search.js" }}<script src="{{ $searchJs.RelPermalink }}" defer></script>{{ end }}
</body>
</html>
