{{ define "main" }}
<div class="page-header">
  <div class="container">
    <h1>{{ .Title }}</h1>
    <div class="page-header__intro">{{ .Content }}</div>
  </div>
</div>
<div class="container">
  <div class="story-grid story-grid--list">
    {{ range .Pages }}{{ partial "story-card.html" (dict "page" .) }}{{ end }}
  </div>
</div>
{{ end }}
